<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcripto — Account</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      window.__API_BASE__ = "http://18.207.238.156:8000";
    </script>
  </head>
  <body>
    <main class="shell auth-stack">
      <header class="header">
        <h1>Transcripto</h1>
        <p class="subhead">Log in or create an account</p>
      </header>

      <div class="auth-toggle" role="tablist" aria-label="Choose authentication mode">
        <button
          type="button"
          id="toggle-login"
          class="auth-toggle-btn is-active"
          role="tab"
          aria-selected="true"
          aria-controls="login-form"
        >
          Log in
        </button>
        <button
          type="button"
          id="toggle-signup"
          class="auth-toggle-btn"
          role="tab"
          aria-selected="false"
          aria-controls="signup-form"
        >
          Sign up
        </button>
      </div>

      <form id="login-form" class="card" novalidate>
        <h2 class="status-title">Log in</h2>
        <label class="field">
          <span class="label">Email</span>
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          />
        </label>
        <label class="field">
          <span class="label">Password</span>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit" class="btn primary" id="login-submit">Log in</button>
      </form>

      <form id="signup-form" class="card hidden" novalidate>
        <h2 class="status-title">Sign up</h2>
        <label class="field">
          <span class="label">Email</span>
          <input
            id="signup-email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          />
        </label>
        <label class="field">
          <span class="label">Password</span>
          <input
            id="signup-password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
        </label>
        <button type="submit" class="btn primary" id="signup-submit">Create account</button>
      </form>

      <p id="success-banner" class="success-banner hidden" role="status"></p>
      <p id="error-banner" class="error-banner hidden" role="alert"></p>
    </main>
    <script src="auth.js" defer></script>
  </body>
</html>
