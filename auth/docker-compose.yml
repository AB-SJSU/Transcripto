# Spring auth-api against Supabase Cloud (see .env.example).
#
# From auth/ :
#   copy .env.example .env
#   docker compose --env-file .env up -d --build
#
# Apply supabase/migrations/*.sql in the Supabase SQL Editor (or psql) before first run.
services:
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharks-auth-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AUTH_API_PORT:-8080}:8080"
