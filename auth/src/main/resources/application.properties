spring.application.name=auth
# Local Supabase CLI Postgres default: localhost:54322 (use host.docker.internal:54322 from auth-api container if Supabase runs on host)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54322/postgres?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Supabase API gateway (Kong) — local self-host default; in Docker use http://kong:8000 (see docker-compose)
supabase.base-url=${SUPABASE_URL:http://localhost:8000}
# JWT anon key from self-host .env ANON_KEY — required for real login
supabase.anon-key=${SUPABASE_ANON_KEY:}
# Service role key from self-host .env SERVICE_ROLE_KEY — required for admin user creation (server-side only)
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
