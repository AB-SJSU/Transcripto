spring.application.name=auth

# --- Database (Supabase Postgres). Use service_role-capable credentials for server-side writes past RLS. ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.sql.init.mode=never

# --- Supabase Auth (login proxy + JWT issuer for resource server) ---
supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
supabase.anon-key=${SUPABASE_ANON_KEY:}
# Server-side only: Admin API (never commit real values).
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
# Optional override if issuer discovery is unavailable:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:}

# --- Internal routes (/internal/**): require header X-Internal-Api-Key ---
auth.internal.api-key=${AUTH_INTERNAL_API_KEY:change-me}

# --- Stub: periodic JWKS broadcast log (disabled by default) ---
auth.stub.jwks-broadcast.enabled=false
auth.stub.jwks-broadcast.interval-ms=3600000

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Logging ---
logging.level.com.sharks.auth=INFO
logging.level.org.springframework.security=INFO
