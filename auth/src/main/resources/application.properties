spring.application.name=auth
# Default: local CLI Postgres (54322). Supabase Cloud: set SPRING_DATASOURCE_URL to the dashboard
# connection string with sslmode=require (and user/password from Project Settings → Database).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54322/postgres?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Supabase project URL (Dashboard → Settings → API), e.g. https://<ref>.supabase.co
supabase.base-url=${SUPABASE_URL:http://localhost:8000}
# Dashboard → API: anon (publishable) key
supabase.anon-key=${SUPABASE_ANON_KEY:}
# Dashboard → API: service_role key (server-only; admin signup)
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
